name: Release & Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate App Entries
        run: npm run validate

      - name: Build Registry & MCP Server
        run: |
          npm run build
          npm run build:mcp

      - name: Run Test Suite
        run: npm run test

      - name: Publish MCP Server to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm --prefix mcp-server publish --access public
          else
            echo "⚠️ NPM_TOKEN secret missing, skipping npm publish."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/registry.json
            mcp-server/dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Step Summary
        if: always()
        run: |
          echo "### 🚀 Automated Release Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry & MCP Server Build**: ✅ Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **NPM Package Release**: Published \`@awesome-mcp-dev-stack-selector/mcp-server\`" >> $GITHUB_STEP_SUMMARY
