name: Build Registry & Render README

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate & Build Registry
        run: npm run test

      - name: Commit Auto-Generated Artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(registry): rebuild registry.json & README.md [skip ci]"
          file_pattern: "dist/registry.json README.md mcp-server/src/bundled-registry.json"
