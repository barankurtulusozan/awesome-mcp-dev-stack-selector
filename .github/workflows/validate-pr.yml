name: Validate PR & Schema Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix mcp-server ci

      - name: Run Schema & Security Validation
        run: npm run validate

      - name: Build MCP Server & Run Integration Tests
        run: npm run test
