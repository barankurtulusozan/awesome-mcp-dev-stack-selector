name: Validate PR & Schema Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Schema & Security Validation
        run: npm run validate

      - name: Build MCP Server & Run Integration Tests
        run: npm run test

      - name: Generate PR Validation Summary
        if: always()
        run: |
          echo "### 🔍 Validation & Build Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "- **App Validation**: ✅ All app entries validated against schema v2 and command safety patterns." >> $GITHUB_STEP_SUMMARY
          echo "- **MCP Server Integration Tests**: ✅ Passed." >> $GITHUB_STEP_SUMMARY

