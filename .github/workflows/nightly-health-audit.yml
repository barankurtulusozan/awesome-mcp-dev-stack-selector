name: Nightly Link & Health Audit

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Circuit Breaker Audit
        run: npm run audit

      - name: Commit Health Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(audit): update app health status & audit state [skip ci]"
          file_pattern: "apps/**/*.json audit-state.json"
